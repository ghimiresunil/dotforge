# To show it again: format = "\\[[${symbol}${pyenv_prefix}(${version})(\\($virtualenv\\))]($style)\\]"
[python]
symbol = " "
format = "\\[[${symbol}${pyenv_prefix}(\\($virtualenv\\))]($style)\\]"

[nodejs]
symbol = " "
format = "\\[[$symbol($version)]($style)\\]"

