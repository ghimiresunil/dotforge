# ~/.config/starship.toml
"$schema" = 'https://starship.rs/config-schema.json'

# ───────────────────────────── Layout ─────────────────────────────
# Line 1: context (os/user/host/dir/git) ── fill ── languages, duration, time
# Line 2: jobs + prompt character
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$fill\
$all\
$cmd_duration\
$battery\
$time\
$line_break\
$jobs\
$character"""

add_newline = true
continuation_prompt = "[∙](bright-black) "

# pyenv shims are slow, so give commands more time (default is 500 ms)
command_timeout = 2000

# ─────────────────────────── Prompt core ──────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[fill]
symbol = "─"
style = "bright-black"

[os]
disabled = false
format = "\\[[$symbol]($style)\\]"

[username]
# Only shown on SSH or as root
style_user = "bold yellow"
style_root = "bold red"
format = "\\[[$user]($style)\\]"

[hostname]
ssh_only = true
ssh_symbol = " "
format = "\\[[$ssh_symbol$hostname]($style)\\]"

[directory]
style = "bold cyan"
read_only = " 󰌾"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_style = "bold underline green"
repo_root_format = '[$before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

# [directory.substitutions]
# "Documents" = "󰈙 "
# "Downloads" = " "
# "Projects" = "󱌢 "
# ".config" = " "

[jobs]
symbol = "✦"
number_threshold = 1
format = "[$symbol$number]($style) "

[cmd_duration]
min_time = 2000
format = "\\[[⏱ $duration]($style)\\]"

[time]
disabled = false
time_format = "%H:%M"
style = "bright-black"
format = "\\[[$time]($style)\\]"

[battery]
format = "\\[[$symbol$percentage]($style)\\]"

[[battery.display]]
threshold = 15
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[memory_usage]
# Enable with `disabled = false`; only appears when RAM use crosses the threshold
disabled = true
threshold = 75
symbol = "󰍛 "
format = "\\[$symbol[$ram( | $swap)]($style)\\]"

[sudo]
disabled = true
format = "\\[[as $symbol]($style)\\]"

# ─────────────────────────────── Git ──────────────────────────────
[git_branch]
symbol = " "
truncation_length = 32
truncation_symbol = "…"
format = "\\[[$symbol$branch(:$remote_branch)]($style)\\]"

[git_commit]
only_detached = true
tag_disabled = false
tag_symbol = " 🏷 "
format = "\\[[$hash$tag]($style)\\]"

[git_state]
format = "\\[[$state( $progress_current/$progress_total)]($style)\\]"

[git_status]
disabled = false
style = "bold red"
format = "([\\[$all_status$ahead_behind\\]]($style))"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_metrics]
# Can be slow in huge repos; set disabled = true if you notice lag
disabled = false
ignore_submodules = true
format = "(\\[[+$added]($added_style) [-$deleted]($deleted_style)\\])"

[fossil_branch]
symbol = " "
format = "\\[[$symbol$branch]($style)\\]"

[hg_branch]
symbol = " "
format = "\\[[$symbol$branch]($style)\\]"

[pijul_channel]
symbol = " "
format = "\\[[$symbol$channel]($style)\\]"

# ───────────────────────── Cloud / containers ─────────────────────
[aws]
symbol = "  "
format = "\\[[$symbol($profile)(\\($region\\))(\\[$duration\\])]($style)\\]"

[docker_context]
symbol = " "
only_with_files = true
format = "\\[[$symbol$context]($style)\\]"

[gcloud]
# Only show when a gcloud project is actually active
detect_env_vars = ["CLOUDSDK_CONFIG", "CLOUDSDK_ACTIVE_CONFIG_NAME"]
format = "\\[[$symbol$account(@$domain)(\\($region\\))]($style)\\]"

[kubernetes]
disabled = false
detect_files = ["k8s", "Chart.yaml", "kustomization.yaml", "skaffold.yaml"]
format = "\\[[$symbol$context( \\($namespace\\))]($style)\\]"

[openstack]
format = "\\[[$symbol$cloud(\\($project\\))]($style)\\]"

[pulumi]
format = "\\[[$symbol$stack]($style)\\]"

[terraform]
format = "\\[[$symbol$workspace]($style)\\]"

[nix_shell]
symbol = " "
format = "\\[[$symbol$state( \\($name\\))]($style)\\]"

[guix_shell]
symbol = " "
format = "\\[[$symbol]($style)\\]"

[conda]
symbol = " "
ignore_base = true
format = "\\[[$symbol$environment]($style)\\]"

[spack]
format = "\\[[$symbol$environment]($style)\\]"

# ───────────────────────────── Languages ──────────────────────────
